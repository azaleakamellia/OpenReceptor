<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenReceptor | Sensitive Receptor Detection for ESIA & TNFD</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2E7D32;
            --primary-dark: #1B5E20;
            --bg-light: #F5F7FA;
            --text-dark: #1A202C;
            --border: #E2E8F0;
        }
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; display: flex; height: 100vh; color: var(--text-dark); }
        
        /* Sidebar Styling */
        #sidebar { 
            width: 320px; background: white; border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,0.05); 
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); background: var(--bg-light); }
        .sidebar-header h1 { margin: 0; font-size: 1.2rem; color: var(--primary-dark); display: flex; align-items: center; gap: 8px; }
        .sidebar-header p { margin: 5px 0 0 0; font-size: 0.8rem; color: #666; }
        
        .sidebar-content { flex: 1; overflow-y: auto; padding: 20px; }
        .section-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: #666; margin-bottom: 10px; letter-spacing: 0.5px; }
        
        .control-group { margin-bottom: 20px; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.9rem; cursor: pointer; }
        .checkbox-label input { accent-color: var(--primary); }
        
        .btn { 
            width: 100%; padding: 10px; border: none; border-radius: 6px; 
            font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; 
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: white; color: var(--primary); border: 1px solid var(--primary); margin-top: 10px; }
        .btn-secondary:hover { background: var(--bg-light); }
        
        .status-box { 
            margin-top: 20px; padding: 10px; border-radius: 6px; font-size: 0.85rem; 
            background: #E8F5E9; color: var(--primary-dark); display: none; 
        }
        
        .sidebar-footer { padding: 15px 20px; border-top: 1px solid var(--border); font-size: 0.75rem; color: #888; text-align: center; }
        .sidebar-footer a { color: var(--primary); text-decoration: none; }

        /* Map Styling */
        #map { flex-grow: 1; height: 100%; }
        
        /* Custom Marker Styles */
        .custom-marker { border-radius: 50%; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h1>🌍 OpenReceptor</h1>
            <p>Dynamic Sensitive Receptor Detection for ESIA, TNFD & ADB</p>
        </div>
        
        <div class="sidebar-content">
            <div class="section-title">1. Social & Anthropogenic Receptors</div>
            <div class="control-group">
                <label class="checkbox-label"><input type="checkbox" id="chk-hospitals" checked> Hospitals & Clinics</label>
                <label class="checkbox-label"><input type="checkbox" id="chk-schools" checked> Schools & Universities</label>
                <label class="checkbox-label"><input type="checkbox" id="chk-worship" checked> Places of Worship</label>
                <label class="checkbox-label"><input type="checkbox" id="chk-residential"> Residential Areas</label>
            </div>

            <div class="section-title">2. Environmental & Ecological Receptors</div>
            <div class="control-group">
                <label class="checkbox-label"><input type="checkbox" id="chk-protected" checked> Protected Areas (WDPA/OSM)</label>
                <label class="checkbox-label"><input type="checkbox" id="chk-water" checked> Water Bodies & Wetlands</label>
            </div>

            <button class="btn btn-primary" onclick="fetchReceptors()"> Update Map to Current View</button>
            <button class="btn btn-secondary" onclick="exportData()">⬇️ Export Receptors (GeoJSON)</button>
            
            <div id="status-box" class="status-box"></div>
        </div>

        <div class="sidebar-footer">
            Developed by <strong>Azalea Kamellia Abdullah, Gs.</strong><br>
            <a href="https://azaleakamellia.github.io" target="_blank">azaleakamellia.github.io</a>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/osmtogeojson@3.0.0-beta.5/osmtogeojson.js"></script>

    <script>
        // 1. Initialize Map (Centered on Sarawak/Malaysia by default)
        const map = L.map('map').setView([1.5, 110.0], 8);

        // Base Layers
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors', maxZoom: 19
        }).addTo(map);

        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© Esri', maxZoom: 19
        });

        L.control.layers({ "OpenStreetMap": osm, "Satellite": satellite }).addTo(map);

        // Layer Groups for Receptors
        const socialLayer = L.geoJSON(null, {
            style: { color: '#E53935', weight: 1, fillOpacity: 0.2 },
            pointToLayer: (feature, latlng) => L.circleMarker(latlng, { radius: 5, color: '#E53935', fillColor: '#E53935', fillOpacity: 0.8 })
        }).addTo(map);

        const envLayer = L.geoJSON(null, {
            style: { color: '#1B5E20', weight: 2, fillOpacity: 0.2 },
            pointToLayer: (feature, latlng) => L.circleMarker(latlng, { radius: 6, color: '#1B5E20', fillColor: '#1B5E20', fillOpacity: 0.8 })
        }).addTo(map);

        let currentData = { type: 'FeatureCollection', features: [] };

        // 2. Core Function: Fetch Data from Overpass API
        async function fetchReceptors() {
            const statusBox = document.getElementById('status-box');
            statusBox.style.display = 'block';
            statusBox.textContent = '⏳ Querying Overpass API... Please wait.';
            statusBox.style.background = '#FFF3E0';
            statusBox.style.color = '#E65100';

            socialLayer.clearLayers();
            envLayer.clearLayers();
            currentData = { type: 'FeatureCollection', features: [] };

            const bounds = map.getBounds();
            const bbox = `${bounds.getSouth()},${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()}`;

            let overpassQuery = `[out:json][timeout:25];(\n`;
            
            // Social Receptors
            if (document.getElementById('chk-hospitals').checked) overpassQuery += `node["amenity"="hospital"](${bbox}); node["amenity"="clinic"](${bbox});\n`;
            if (document.getElementById('chk-schools').checked) overpassQuery += `node["amenity"="school"](${bbox}); node["amenity"="university"](${bbox});\n`;
            if (document.getElementById('chk-worship').checked) overpassQuery += `node["amenity"="place_of_worship"](${bbox});\n`;
            if (document.getElementById('chk-residential').checked) overpassQuery += `way["landuse"="residential"](${bbox});\n`;
            
            // Environmental Receptors
            if (document.getElementById('chk-protected').checked) overpassQuery += `relation["boundary"="protected_area"](${bbox});\n`;
            if (document.getElementById('chk-water').checked) overpassQuery += `way["natural"="water"](${bbox}); way["waterway"="river"](${bbox});\n`;
            
            overpassQuery += `);\nout body;>;out skel qt;`;

            try {
                const response = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: overpassQuery
                });
                const data = await response.json();
                const geojson = osmtogeojson(data);
                
                // Separate into social and environmental layers based on tags
                geojson.features.forEach(feature => {
                    const tags = feature.properties.tags || {};
                    const isSocial = tags.amenity || tags.landuse === 'residential';
                    const isEnv = tags.boundary === 'protected_area' || tags.natural === 'water' || tags.waterway;

                    if (isSocial) {
                        feature.properties.layer = 'social';
                        socialLayer.addData(feature);
                    }
                    if (isEnv) {
                        feature.properties.layer = 'environmental';
                        envLayer.addData(feature);
                    }
                    currentData.features.push(feature);
                });

                statusBox.textContent = `✅ Success! Found ${currentData.features.length} receptors in current view.`;
                statusBox.style.background = '#E8F5E9';
                statusBox.style.color = '#1B5E20';

            } catch (error) {
                statusBox.textContent = '❌ Error fetching data. Try zooming in closer.';
                statusBox.style.background = '#FFEBEE';
                statusBox.style.color = '#C62828';
                console.error(error);
            }
        }

        // 3. Export Function
        function exportData() {
            if (currentData.features.length === 0) {
                alert('No data to export. Please run "Update Map" first.');
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentData));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "openreceptor_export.geojson");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        // Initial load
        fetchReceptors();
    </script>
</body>
</html>
